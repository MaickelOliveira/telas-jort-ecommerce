name: telas-jort

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    env_file: .env.production
    volumes:
      - store_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1770
      - /app/.next/cache:uid=1001,gid=1001,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
    mem_limit: 1g
    cpus: 1.5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend
    mem_limit: 256m

volumes:
  store_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
